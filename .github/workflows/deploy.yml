name: Deploy to GitHub Pages

# This workflow assumes the Astro project sits at the repository root, which
# is the layout produced by pushing from inside the `site/` directory —
# `astro.config.mjs`, `package.json` and `src/` are all top level.
#
# The dataset, the icons and the palette PNGs are generated rather than
# committed, so every deploy rebuilds them. That is why this does noticeably
# more than `npm ci && npm run build`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      palette_count:
        description: 'How many palettes to generate'
        required: false
        default: '100000'

# Required to publish. The token is scoped to this run only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Running deploys finish rather than being
# cancelled: a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The image pipeline shells out to Pillow, which is not preinstalled on
      # the runner. Installing it here rather than later means a missing
      # dependency fails in seconds instead of after the dataset has already
      # been generated.
      - name: Install Pillow
        run: python3 -m pip install --quiet --break-system-packages Pillow

      - name: Generate palettes
        run: node scripts/generate-palettes.mjs --count=${{ github.event.inputs.palette_count || '100000' }} --chunk=1000

      - name: Generate icons
        run: npm run icons

      - name: Generate palette images
        run: npm run images

      # `vars`, not `secrets`, and that is deliberate rather than incidental.
      #
      # A Firebase web config is public by design. It ships inside the client
      # bundle of every site that uses one, so anyone can read it from view
      # source; what actually controls access is the database rules. Storing it
      # as a secret would imply a confidentiality this data does not have, and
      # would hide the values from logs where seeing them is useful.
      #
      # The two are easy to confuse: Secrets and Variables are neighbouring
      # tabs on the same settings page, and `${{ secrets.X }}` silently
      # resolves to an empty string when X is a variable. That produced a green
      # build, a deployed site, and likes that quietly did nothing.
      #
      # Written to a file rather than passed on `env:`, because Astro inlines
      # `import.meta.env.PUBLIC_*` into the browser bundle from .env files.
      - name: Write .env for the client bundle
        run: |
          cat > .env <<'ENV'
          PUBLIC_FIREBASE_API_KEY=${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_DATABASE_URL=${{ vars.PUBLIC_FIREBASE_DATABASE_URL }}
          PUBLIC_FIREBASE_PROJECT_ID=${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID=${{ vars.PUBLIC_FIREBASE_APP_ID }}
          ENV
          # Fail here rather than shipping a build with likes quietly disabled.
          # A missing value produces a line ending in "=", which is exactly the
          # state that used to look like everything was configured.
          if grep -q '=$' .env; then
            echo "::error::These repository variables are missing or empty:"
            grep -n '=$' .env | cut -d= -f1
            echo "Set them under Settings, Secrets and variables, Actions, Variables tab."
            exit 1
          fi
          echo "All 7 Firebase values present."

      - name: Build
        env:
          SITE_URL: https://palettevault.github.io
        run: npm run build

      # Catches the two failures that are otherwise invisible until someone
      # reports a broken site days later.
      - name: Verify output
        run: |
          set -e
          test -f dist/.nojekyll \
            || { echo "::error::dist/.nojekyll is missing — Jekyll will drop _astro/ and the site will load unstyled"; exit 1; }
          test -f dist/404.html \
            || { echo "::error::dist/404.html is missing — palette pages that are not pre-rendered will not resolve"; exit 1; }
          test -f dist/index.html && test -f dist/sitemap.xml && test -f dist/robots.txt

          echo "Pages:  $(find dist -name index.html | wc -l)"
          echo "Images: $(ls dist/p 2>/dev/null | wc -l)"
          echo "Files:  $(find dist -type f | wc -l)"

          # GitHub Pages refuses to publish a site over 1 GB.
          SIZE_MB=$(du -sm dist | cut -f1)
          if [ "$SIZE_MB" -gt 900 ]; then
            echo "::error::dist is ${SIZE_MB} MB, close to the 1 GB GitHub Pages limit. Lower PRERENDER_PALETTES or the palette count."
            exit 1
          fi
          echo "::notice::dist is ${SIZE_MB} MB"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
